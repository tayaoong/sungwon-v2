<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | KCC 성원창호</title>
<link rel="icon" href="../assets/brand/logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap">
<link rel="stylesheet" href="../assets/css/admin-v2.css">
</head>
<body class="adm">

<!-- 로그인 -->
<section class="login" id="login" hidden>
  <div class="login-img"><span class="en">Seongwon Window</span><p>KCC 성원창호 관리자</p></div>
  <form class="login-card" id="loginForm">
    <img class="login-logo" src="../assets/brand/logo.png" alt="KCC 성원창호">
    <span class="label-en">Admin</span>
    <h1>관리자 로그인</h1>
    <p class="muted" id="loginSub">홈페이지로 들어온 문의를 확인하고 관리해요.</p>
    <div class="field" id="emailField">
      <label for="email">이메일</label>
      <input class="input" id="email" type="email" autocomplete="username">
    </div>
    <div class="field">
      <label for="pw">비밀번호</label>
      <input class="input" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호를 입력해주세요">
    </div>
    <p class="login-err" id="loginErr"></p>
    <button class="btn fill block" type="submit" id="loginBtn">로그인</button>
    <p class="demo-hint" id="demoHint" hidden>데모 비밀번호 <b id="demoPw"></b></p>
    <a class="back-site" href="../index.html">← 홈페이지로 돌아가기</a>
  </form>
</section>

<!-- 관리 화면 -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <a class="tb-logo" href="../index.html" target="_blank" id="admLogo"><img src="../assets/brand/logo.png" alt="KCC 성원창호"></a>
    <span class="adm-tag en">ADMIN</span>
    <span class="mode-tag" id="modeTag"></span>
    <div class="top-actions">
      <button class="btn sm" id="exportBtn" type="button"><span data-i="download"></span>엑셀로 받기</button>
      <button class="btn sm" id="logoutBtn" type="button">로그아웃</button>
    </div>
  </header>

  <main class="adm-main">
    <div class="adm-head">
      <div>
        <span class="label-en">Inquiry</span>
        <h1>문의 관리</h1>
        <p class="muted" id="updated">불러오는 중…</p>
      </div>
      <button class="btn sm" id="refreshBtn" type="button"><span data-i="refresh"></span>새로고침</button>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="toolbar">
      <div class="status-tabs" id="tabs"></div>
      <div class="search">
        <span data-i="search"></span>
        <input class="input" id="q" type="search" placeholder="이름, 전화번호, 지역으로 찾기">
      </div>
    </div>

    <div class="list-wrap">
      <table class="tbl" id="tbl">
        <thead><tr><th>접수</th><th>고객</th><th>문의 종류</th><th>평형</th><th>지역</th><th>문의 내용</th><th>상태</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>
        <span class="ico" data-i="inbox"></span>
        <b id="emptyTitle">아직 들어온 문의가 없어요</b>
        <p id="emptyDesc">홈페이지에서 문의가 들어오면 여기에 바로 떠요.</p>
        <div class="btn-row">
          <a class="btn fill sm" href="../contact.html" target="_blank">문의 화면 열기</a>
          <button class="btn sm" id="seedBtn" type="button" hidden>예시 문의 넣어보기</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 상세 서랍 -->
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<!-- 사진 크게 보기 -->
<div class="viewer" id="viewer" hidden><img alt=""><button type="button" aria-label="닫기">CLOSE</button></div>

<div class="toast" id="toast"></div>

<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
